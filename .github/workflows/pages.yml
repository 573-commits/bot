name: Deploy to GitHub Pages

on:
  push:
    # Výchozí větev repozitáře je rovnou vývojová, žádný main tu není –
    # kdyby se jen hlídaly main/master, nasazení by se nikdy nespustilo.
    branches: [main, master, 'claude/math-gym-app-funesh']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pozn.: zapnout Pages odsud nejde – token v Actions na vytvoření
      # Pages webu nemá právo. Jednou je potřeba Settings → Pages →
      # Source: GitHub Actions, dál už se nasazuje samo.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
